<svg viewBox="0 0 1440 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="amberGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ff9900"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Left Sweeping Arrow & Concentric Arcs -->
  <g class="left-arcs">
    <!-- Outer gray guide arrow -->
    <path d="M 20 380 A 340 340 0 0 1 240 60" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)" opacity="0.6"/>
    
    <!-- Concentric Amber & Orange Rings -->
    <circle cx="320" cy="420" r="140" stroke="rgba(255, 153, 0, 0.15)" stroke-width="1.5" fill="none"/>
    <circle cx="320" cy="420" r="170" stroke="rgba(255, 153, 0, 0.25)" stroke-width="1.5" fill="none"/>
    <circle cx="320" cy="420" r="200" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" fill="none"/>
    <circle cx="320" cy="420" r="230" stroke="rgba(255, 153, 0, 0.55)" stroke-width="2.5" fill="none"/>
    <circle cx="320" cy="420" r="260" stroke="url(#orangeArcGrad)" stroke-width="3" fill="none"/>
    <circle cx="320" cy="420" r="290" stroke="rgba(255, 153, 0, 0.35)" stroke-width="2" stroke-dasharray="12 8" fill="none"/>
    
    <!-- Active Orange Leading Arc with Arrow -->
    <path d="M 120 420 A 200 200 0 0 1 450 250" stroke="#ff9900" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- Right Sweeping Concentric Arcs -->
  <g class="right-arcs">
    <circle cx="1180" cy="420" r="150" stroke="rgba(255, 153, 0, 0.15)" stroke-width="1.5" fill="none"/>
    <circle cx="1180" cy="420" r="190" stroke="rgba(255, 153, 0, 0.25)" stroke-width="2" fill="none"/>
    <circle cx="1180" cy="420" r="230" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2.5" fill="none"/>
    <circle cx="1180" cy="420" r="270" stroke="url(#orangeArcGrad)" stroke-width="3" fill="none"/>
    <circle cx="1180" cy="420" r="310" stroke="rgba(255, 153, 0, 0.2)" stroke-width="1.5" stroke-dasharray="16 10" fill="none"/>
    <path d="M 1420 420 A 240 240 0 0 0 980 220" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
