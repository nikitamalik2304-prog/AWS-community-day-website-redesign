<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffac33" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="smileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .smile-curve {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawSmile 3s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    @keyframes drawSmile {
      0% { stroke-dashoffset: 800; opacity: 0.3; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
  </style>

  <!-- Amazon Smile Arrow Curve -->
  <g transform="translate(150, 40)" filter="url(#smileGlow)">
    <path class="smile-curve" d="M 70 240 C 230 360, 520 360, 670 210" stroke="url(#smileGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Arrow Head -->
    <path d="M 640 200 L 695 200 L 665 245 Z" fill="#ff9900" transform="rotate(-15 670 210)"/>
  </g>
</svg>
